<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 96" width="720" height="96" role="img"
     aria-labelledby="titre description" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="titre">Illustration : EnergIA dans la barre de menus</title>
  <desc id="description">Une barre de menus sombre. À droite, l'élément EnergIA affiche un éclair jaune suivi de « 1,02 kWh », entre des icônes génériques et l'heure.</desc>

  <!-- Fond et barre de menus -->
  <rect width="720" height="96" rx="12" fill="#2b2f36"/>
  <rect width="720" height="40" rx="12" fill="#1a1a19"/>
  <rect y="20" width="720" height="20" fill="#1a1a19"/>

  <!-- Menus de l'application au premier plan (génériques) -->
  <g fill="#f0efec" font-size="14">
    <circle cx="26" cy="20" r="7"/>
    <text x="48" y="25" font-weight="700">Appli</text>
    <text x="96" y="25">Fichier</text>
    <text x="152" y="25">Édition</text>
    <text x="210" y="25">Fenêtre</text>
  </g>

  <!-- Icônes génériques voisines -->
  <g fill="none" stroke="#c3c2b7" stroke-width="1.8" stroke-linecap="round">
    <circle cx="418" cy="20" r="7"/>
    <rect x="442" y="13" width="18" height="14" rx="3"/>
    <path d="M477 25 a9 9 0 0 1 18 0 M481 25 a5 5 0 0 1 10 0"/>
  </g>

  <!-- L'élément EnergIA, mis en évidence -->
  <rect x="510" y="6" width="104" height="28" rx="7" fill="#3a3a37"/>
  <path d="M530 10 L521 22 h6 l-2 9 l9 -12 h-6 z" fill="#fab219"/>
  <text x="541" y="25" fill="#f0efec" font-size="14" font-weight="600">1,02 kWh</text>

  <!-- Date et heure -->
  <text x="704" y="25" fill="#f0efec" font-size="14" text-anchor="end">mer. 15:30</text>

  <!-- Légende pointant vers l'élément -->
  <path d="M562 40 v14" stroke="#c3c2b7" stroke-width="1.5"/>
  <circle cx="562" cy="40" r="2.5" fill="#c3c2b7"/>
  <text x="704" y="74" fill="#f0efec" font-size="13" text-anchor="end">Énergie estimée du jour. Un clic ouvre le tableau de bord.</text>
</svg>
